name: Publish to GitHub Packages

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (leave empty to use git tag or sdkVersion)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine publish version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION=""
          fi
          # Strip optional leading 'v'
          VERSION="${VERSION#v}"
          echo "Publish version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Run unit tests before publishing
        run: ./gradlew :ads-core:testDebugUnitTest --no-daemon

      - name: Publish all library modules to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ steps.get_version.outputs.version }}" ]; then
            EXTRA_ARGS="-Pversion=${{ steps.get_version.outputs.version }}"
          fi
          ./gradlew publishReleasePublicationToGitHubPackagesRepository $EXTRA_ARGS --no-daemon --stacktrace
